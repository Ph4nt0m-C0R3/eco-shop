# Reference for a Linux VPS. Replace the domain, certificate paths and FPM socket.
# Enable only after provisioning the real certificate and application environment.
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;
    return 308 https://shop.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shop.example.com;
    ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/ecoshop/current/public;
    index index.php;
    charset utf-8;
    autoindex off;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ /\.(?!well-known) { deny all; }

    # Only Laravel's front controller is executable, including under /storage.
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Strict-Transport-Security;
    }
    location ~* \.(php[0-9]?|phtml|phar)(/|$) { return 404; }
}
